project:
  type: book
  output-dir: _book

book:
  title: "Applied Statistics: From Data to Decisions"
  author: "Madeleine Udell"
  date: "Spring 2026"
  chapters:
    - index.qmd
    - part: "Act 1: Build Models"
      chapters:
        - lec01-intro.qmd
        - lec02-eda.qmd
        - lec03-munging.qmd
        - lec04-regression.qmd
        - lec05-feature-engineering.qmd
        - lec06-validation.qmd
        - lec07-classification.qmd
    - part: "Act 2: Trust Models"
      chapters:
        - lec08-sampling.qmd
        - lec09-permutation-tests.qmd
        - lec10-hypothesis-testing.qmd
        - lec11-multiple-testing.qmd
        - lec12-regression-inference.qmd
        - lec12.5-classification-inference.qmd
    - part: "Act 3: See Further"
      chapters:
        - lec13-trees.qmd
        - lec14-pca.qmd
        - lec15-clustering.qmd
        - lec16-feedback-loops.qmd
        - lec17-working-with-ai.qmd
        - lec18-causal-inference-1.qmd
        - lec19-causal-inference-2.qmd
    - part: "Appendices"
      chapters:
        - appendix-probability.qmd
        - appendix-tools.qmd

filters:
  - _notebook-links.lua
  - _feedback-link.lua

format:
  html:
    theme:
      - cosmo
      - custom.scss
    code-fold: true
    code-tools: true
    toc: true
    number-sections: false
    fontsize: 1.05em
    mainfont: "system-ui, -apple-system, sans-serif"
    include-after-body:
      - code-tools-fix.html

jupyter: python3

execute:
  freeze: auto
