on:
  push:
    branches: main

name: Render and deploy Quarto book

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install jupyter pyyaml numpy pandas matplotlib seaborn scipy scikit-learn statsmodels

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Convert .qmd to .ipynb notebooks
        run: |
          mkdir -p notebooks
          for f in lec*.qmd; do
            quarto convert "$f" --output "notebooks/${f%.qmd}.ipynb"
          done

      - name: Fix notebooks for Colab (DATA_DIR, YAML frontmatter)
        run: |
          python3 - << 'PYEOF'
          import json, glob, os, yaml

          for nb_path in sorted(glob.glob("notebooks/lec*.ipynb")):
              with open(nb_path) as f:
                  nb = json.load(f)

              # --- Fix YAML frontmatter in first cell → markdown heading ---
              if nb["cells"] and nb["cells"][0]["cell_type"] == "markdown":
                  src = "".join(nb["cells"][0]["source"])
                  if src.startswith("---"):
                      parts = src.split("---", 2)
                      if len(parts) >= 3:
                          fm_text = parts[1]
                          remainder = parts[2].strip()
                          try:
                              fm = yaml.safe_load(fm_text)
                          except yaml.YAMLError:
                              fm = {}
                          title = fm.get("title", "")
                          heading = f"# {title}" if title else ""
                          new_src = heading + ("\n\n" + remainder if remainder else "") + "\n"
                          nb["cells"][0]["source"] = [new_src]
                          print(f"  Converted frontmatter to heading in {os.path.basename(nb_path)}")

              # --- Fix DATA_DIR for Colab ---
              for cell in nb["cells"]:
                  if cell["cell_type"] == "code":
                      cell["source"] = [
                          line.replace("DATA_DIR = 'data'", "DATA_DIR = 'https://raw.githubusercontent.com/stanford-mse-125/book/main/data'")
                               .replace("pd.read_csv(f'{DATA_DIR}/", "pd.read_csv(f'{DATA_DIR}/")
                          for line in cell["source"]
                      ]

              with open(nb_path, "w") as f:
                  json.dump(nb, f, indent=1)
              print(f"  Patched {os.path.basename(nb_path)}")
          PYEOF

      - name: Commit notebooks to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notebooks/
          if git diff --cached --quiet; then
            echo "No notebook changes to commit"
          else
            git commit -m "Auto-generate Jupyter notebooks from .qmd sources"
            git push
          fi

      - name: Render Quarto book
        run: quarto render --execute

      - name: Copy notebooks into book output
        run: cp -r notebooks _book/notebooks

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
