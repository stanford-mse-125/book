on:
  push:
    branches: main

name: Render and deploy Quarto book

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install jupyter pyyaml numpy pandas matplotlib seaborn scipy scikit-learn statsmodels

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Convert .qmd to .ipynb notebooks
        run: |
          mkdir -p notebooks
          for f in lec*.qmd; do
            quarto convert "$f" --output "notebooks/${f%.qmd}.ipynb"
          done

      - name: Fix notebooks for Colab (DATA_DIR, YAML frontmatter)
        run: |
          python3 - << 'PYEOF'
          import json, glob, os, yaml

          for nb_path in sorted(glob.glob("notebooks/lec*.ipynb")):
              with open(nb_path) as f:
                  nb = json.load(f)

              # --- Fix YAML frontmatter in first cell → markdown heading ---
              if nb["cells"] and nb["cells"][0]["cell_type"] == "markdown":
                  src = "".join(nb["cells"][0]["source"])
                  if src.startswith("---"):
                      parts = src.split("---", 2)
                      if len(parts) >= 3:
                          fm_text = parts[1]
                          remainder = parts[2].strip()
                          try:
                              fm = yaml.safe_load(fm_text)
                          except yaml.YAMLError:
                              fm = {}
                          title = fm.get("title", "")
                          heading = f"# {title}" if title else ""
                          new_src = heading + ("\n\n" + remainder if remainder else "") + "\n"
                          nb["cells"][0]["source"] = [new_src]
                          print(f"  Converted frontmatter to heading in {os.path.basename(nb_path)}")

              # --- Fix data paths for Colab ---
              # Route datasets to original sources or GitHub release assets
              # to avoid Git LFS bandwidth consumption.
              import re

              RAW = "https://raw.githubusercontent.com/stanford-mse-125/book/main/data"
              RELEASE = "https://github.com/stanford-mse-125/book/releases/download/data-v1"
              EPA = "https://aqs.epa.gov/aqsweb/airdata"

              # Files hosted as GitHub release assets (no stable original source)
              RELEASE_FILES = {
                  "airbnb/listings.csv",
                  "nba/nba_load_management.csv",
                  "nba/nba_game_logs_2022_2024.csv",
                  "nba/shot_mix_by_season.csv",
              }

              for cell in nb["cells"]:
                  if cell["cell_type"] == "code":
                      new_source = []
                      for line in cell["source"]:
                          # Remove DATA_DIR definition
                          if line.strip().startswith("DATA_DIR"):
                              line = ""
                          # EPA: download zips directly from EPA (keep f-string for {year})
                          elif "epa-air-quality/daily_aqi_by_county_" in line:
                              line = line.replace(
                                  f"f'{{DATA_DIR}}/epa-air-quality/daily_aqi_by_county_{{year}}.csv'",
                                  f"f'{EPA}/daily_aqi_by_county_{{year}}.zip', compression='zip'"
                              )
                          else:
                              # Replace each f'{DATA_DIR}/path/file.csv' with full URL
                              for m in re.findall(r"f'\{DATA_DIR\}/([^']+)'", line):
                                  if m in RELEASE_FILES:
                                      fname = m.split("/")[-1]
                                      url = f"{RELEASE}/{fname}"
                                  else:
                                      url = f"{RAW}/{m}"
                                  line = line.replace(f"f'{{DATA_DIR}}/{m}'", f"'{url}'")
                          new_source.append(line)
                      cell["source"] = new_source

              with open(nb_path, "w") as f:
                  json.dump(nb, f, indent=1)
              print(f"  Patched {os.path.basename(nb_path)}")
          PYEOF

      - name: Render Quarto book
        run: quarto render --execute

      - name: Copy notebooks into book output
        run: cp -r notebooks _book/notebooks

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book

      - name: Push notebooks to notebooks branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cd notebooks
          git init
          git checkout -b notebooks
          git add *.ipynb
          git commit -m "Auto-generate Jupyter notebooks from .qmd sources"
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git push origin notebooks --force

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
